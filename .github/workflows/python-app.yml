# JArvis is a Windows-only voice assistant: it imports comtypes, pywin32 and
# pypiwin32, and talks to SAPI5 through pyttsx3. The dependency install job
# therefore has to run on windows-latest, not ubuntu.
#
# Lint runs separately on ubuntu because flake8 only parses the source and
# does not need the Windows packages installed.

name: Python application

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
    - name: Install flake8
      run: |
        python -m pip install --upgrade pip
        pip install flake8
    - name: Syntax and undefined-name check
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
    - name: Full lint
      run: |
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  security-audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
    - name: Audit pinned dependencies
      # --no-deps/--disable-pip: pywin32 has no Linux wheel, so resolve the
      # pinned versions against the advisory database instead of installing.
      run: |
        python -m pip install --upgrade pip
        pip install pip-audit
        pip-audit -r requirements.txt --no-deps --disable-pip

  install-windows:
    name: Install check (Windows)
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Verify imports resolve
      # Imports are checked without executing the assistant: pyttsx3.init() and
      # the microphone need a desktop session that CI does not have.
      run: |
        python -c "import PIL, requests, wikipedia, bs4, SpeechRecognition; print('core imports OK')"